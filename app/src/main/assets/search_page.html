<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__QUERY__</title>
<style>
    :root {
        --bg-start: #fbfbfc;
        --bg-end: #eef0f4;
        --text: #17181c;
        --sub: #7a7b85;
        --faint: #a4a5ae;
        --link: #0b57d0;
        --card: rgba(255, 255, 255, 0.82);
        --card-border: rgba(30, 40, 80, 0.06);
        --card-shadow: 0 1px 2px rgba(30, 40, 80, 0.04), 0 8px 24px rgba(30, 40, 80, 0.06);
        --input-bg: rgba(255, 255, 255, 0.90);
        --hl: #4f46e5;
        --hl-bg: rgba(99, 102, 241, 0.09);
        --glow1: rgba(99, 102, 241, 0.10);
        --glow2: rgba(34, 211, 238, 0.08);
        --focus-ring: rgba(99, 102, 241, 0.12);
        --focus-border: rgba(99, 102, 241, 0.45);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg-start: #131418;
            --bg-end: #191b21;
            --text: #e7e5ea;
            --sub: #9a9ba5;
            --faint: #6e6f78;
            --link: #a8c7fa;
            --card: rgba(35, 37, 44, 0.72);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 10px 28px rgba(0, 0, 0, 0.30);
            --input-bg: rgba(38, 40, 47, 0.85);
            --hl: #a5b4fc;
            --hl-bg: rgba(165, 180, 252, 0.10);
            --glow1: rgba(99, 102, 241, 0.15);
            --glow2: rgba(34, 211, 238, 0.09);
            --focus-ring: rgba(165, 180, 252, 0.14);
            --focus-border: rgba(165, 180, 252, 0.40);
        }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg-end); -webkit-text-size-adjust: 100%; }
    body {
        color: var(--text);
        font-family: system-ui, sans-serif;
    }
    a { -webkit-tap-highlight-color: transparent; }
    ::selection { background: rgba(99, 102, 241, 0.25); }
    /* 固定在视口的背景：顶部两团极光微光 + 纵向渐变，不随内容拉伸 */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
            radial-gradient(60% 32% at 18% 0%, var(--glow1) 0%, transparent 70%),
            radial-gradient(55% 30% at 88% 4%, var(--glow2) 0%, transparent 70%),
            linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px 0; }
    form { position: relative; margin-bottom: 4px; }
    form svg {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        stroke: var(--faint);
        pointer-events: none;
    }
    input[type=search] {
        width: 100%;
        height: 50px;
        border: 1px solid var(--card-border);
        border-radius: 25px;
        background: var(--input-bg);
        color: var(--text);
        box-shadow: var(--card-shadow);
        padding: 0 22px 0 44px;
        font-size: 15px;
        outline: none;
        -webkit-appearance: none;
        transition: box-shadow .2s ease, border-color .2s ease;
    }
    input[type=search]:focus {
        border-color: var(--focus-border);
        box-shadow: 0 0 0 3px var(--focus-ring), var(--card-shadow);
    }
    input[type=search]::placeholder { color: var(--faint); }
    .note {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11.5px;
        letter-spacing: .4px;
        color: var(--faint);
        margin: 12px 8px 14px;
    }
    .note::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex: none;
        background: linear-gradient(135deg, #6366f1, #22d3ee);
    }
    .item {
        display: block;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 16px 18px;
        margin-bottom: 12px;
        text-decoration: none;
        color: var(--text);
        box-shadow: var(--card-shadow);
        animation: rise .5s cubic-bezier(.2, .7, .3, 1) both;
        animation-delay: calc(var(--i, 0) * 45ms);
        transition: transform .15s ease;
    }
    .item:active { transform: scale(0.985); }
    @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .head { display: flex; align-items: center; margin-bottom: 8px; }
    .host {
        font-size: 12px;
        letter-spacing: .2px;
        color: var(--sub);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .engine {
        margin-left: auto;
        flex: none;
        font-size: 10px;
        letter-spacing: .5px;
        color: var(--faint);
        border: 1px solid var(--card-border);
        border-radius: 999px;
        padding: 2px 8px 3px;
    }
    .title {
        font-size: 16.5px;
        font-weight: 600;
        line-height: 1.42;
        letter-spacing: .1px;
        margin-bottom: 5px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .item:active .title { color: var(--link); }
    .snippet {
        font-size: 13.5px;
        color: var(--sub);
        line-height: 1.62;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .hl {
        font-style: normal;
        font-weight: 600;
        color: var(--hl);
        background: var(--hl-bg);
        border-radius: 4px;
        padding: 0 2px;
    }
    footer {
        text-align: center;
        margin: 10px 24px 0;
        padding: 18px 0 42px;
        border-top: 1px solid var(--card-border);
        font-size: 12px;
        letter-spacing: .3px;
        color: var(--faint);
    }
    footer a { color: var(--link); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
    <form action="mind://search" method="get">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="M20 20 L16.5 16.5"/>
        </svg>
        <input type="search" name="q" value="__QUERY_ATTR__" placeholder="搜索或输入网址">
    </form>
    <div class="note">已整理 __COUNT__ 条结果 · 多源聚合 · 无广告</div>
    __ITEMS__
    <footer>结果不满意？<a href="__RAW_URL__">查看 __ENGINE_NAME__ 原始结果</a></footer>
</div>
</body>
</html>
